spring:
  datasource:
    url: jdbc:h2:mem:issuetracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  seed-demo-data: false
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-0123456789
  attachments:
    # Kept out of the working tree; the OS clears it.
    directory: ${java.io.tmpdir}/issuetracker-test-attachments
    # No background sweeping during tests - the sweep is called directly instead.
    sweep-cron: "-"
    orphan-grace: 0s
  branding:
    # A sibling of the attachment directory, never inside it.
    directory: ${java.io.tmpdir}/issuetracker-test-branding
