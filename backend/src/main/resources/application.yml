spring:
  application:
    name: issue-tracker
  profiles:
    # Switch persistence with: -Dspring.profiles.active=mysql  (or h2)
    active: ${DB_PROFILE:h2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Override in production. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-key-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
