spring:
  application:
    name: issue-tracker
  profiles:
    # Switch persistence with: -Dspring.profiles.active=mysql  (or h2)
    active: ${DB_PROFILE:h2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # Container-level backstop. app.attachments.max-size-bytes is the limit users see;
      # this sits just above it so an oversized upload is refused before it is buffered.
      max-file-size: ${ATTACHMENT_MAX_SIZE:11MB}
      max-request-size: ${ATTACHMENT_MAX_SIZE:11MB}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Override in production. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-key-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  attachments:
    # Must not be under any statically served path: these files are handed out only
    # through /api/attachments/{id}, after the project access check.
    directory: ${ATTACHMENT_DIR:data/attachments}
    max-size-bytes: ${ATTACHMENT_MAX_BYTES:10485760}
    max-per-ticket: ${ATTACHMENT_MAX_PER_TICKET:20}

logging:
  level:
    org.springframework.security: INFO
