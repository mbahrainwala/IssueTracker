spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/issuetracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
