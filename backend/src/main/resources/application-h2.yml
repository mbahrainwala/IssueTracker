spring:
  datasource:
    # MODE=MySQL keeps a single Flyway migration set valid on both engines.
    url: jdbc:h2:file:./data/issuetracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
